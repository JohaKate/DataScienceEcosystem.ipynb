name: Hotel Costa Bella CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: hotel_reservas_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio
    
    - name: Wait for MySQL
      run: |
        while ! mysqladmin ping -h "127.0.0.1" --silent; do
          sleep 1
        done
    
    - name: Set up database
      run: |
        mysql -h 127.0.0.1 -u root -ppassword < backend/schema.sql
      env:
        DATABASE_URL: mysql+mysqlconnector://root:password@127.0.0.1:3306/hotel_reservas_test
    
    - name: Run tests
      run: |
        pytest backend/tests/ -v
      env:
        DATABASE_URL: mysql+mysqlconnector://root:password@127.0.0.1:3306/hotel_reservas_test
        WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Run security scan
      uses: pypa/gh-action-pip-audit@v1.0.8
      with:
        inputs: backend/requirements.txt

  docker-build:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/hotel-costa-bella:latest
          ghcr.io/${{ github.repository }}/hotel-costa-bella:${{ github.sha }}

  deploy-staging:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment"
        # Aquí iría el script de deployment a staging
        # Por ejemplo, usando Heroku, Render, o AWS

  deploy-production:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment"
        # Aquí iría el script de deployment a producción
